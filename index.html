<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Libro de Gastos</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#26332B">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F7F2E4;
    --paper-dim:#EFE7D2;
    --ink:#26332B;
    --ink-soft:#5B6157;
    --rule:#CBBF9C;
    --rule-strong:#A4966B;
    --green:#2E6B4F;
    --green-soft:#E2EEE4;
    --red:#9B3B2C;
    --red-soft:#F3E1DA;
    --brass:#A67C3D;
    --brass-soft:#F1E4C4;
  }
  *{box-sizing:border-box; min-width:0;}
  body{margin:0;}
  html,body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    width:100%;
  }
  ::selection{background:var(--brass-soft);}

  .wrap{max-width:920px;margin:0 auto;padding:16px 16px 90px; overflow-x:hidden;}

  .topbar{
    display:flex; justify-content:flex-start; margin-bottom:10px; position:relative;
  }
  .menu-wrap{position:relative;}
  .hamburger-btn{
    font-family:'Inter',sans-serif; font-size:16px; font-weight:600; line-height:1;
    background:var(--paper-dim); border:1px solid var(--rule-strong); color:var(--ink);
    width:38px; height:38px; padding:0; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .hamburger-btn:hover{background:#e6dfc8;}
  .dropdown-menu{
    display:none; position:absolute; left:0; top:calc(100% + 6px);
    background:var(--paper); border:1px solid var(--rule-strong); border-radius:8px;
    min-width:200px; box-shadow:0 4px 14px rgba(38,51,43,0.18); overflow:hidden; z-index:60;
  }
  .dropdown-menu.open{display:block;}
  .dropdown-version{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
    padding:8px 14px; border-bottom:1px solid var(--rule); letter-spacing:.04em;
  }
  .dropdown-menu button{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:none; border:none; padding:10px 14px; font-family:'Inter',sans-serif;
    font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;
  }
  .dropdown-menu button:hover{background:var(--paper-dim);}
  #fileImport{display:none;}

  header.cover{
    border:1px solid var(--rule-strong);
    border-radius:4px;
    background:
      repeating-linear-gradient(180deg, transparent 0 37px, var(--rule) 37px 38px),
      var(--paper);
    padding:26px 24px 20px;
    position:relative;
    margin-bottom:22px;
    overflow:hidden;
  }
  header.cover::before{
    content:"";
    position:absolute; left:54px; top:80px; bottom:0; width:1px;
    border-left:1px dashed rgba(155,59,44,0.35);
  }
  h1.title{
    font-family:'Roboto Slab',serif;
    font-weight:700;
    font-size:clamp(24px,4.5vw,34px);
    margin:0 0 16px 0;
    padding-bottom:10px;
    border-bottom:1px solid var(--rule-strong);
    line-height:1.1;
    letter-spacing:-0.01em;
    text-align:center;
  }
  .subdate{
    margin:0 0 16px 56px;
    padding-bottom:10px;
    border-bottom:1px solid var(--rule-strong);
    font-size:13px;
    color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;
  }
  .balance-row{margin-left:56px; display:flex; gap:24px; flex-wrap:wrap; align-items:flex-end;}
  .balance-figure{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:clamp(24px,5vw,38px);
    border-bottom:3px double var(--ink); padding-bottom:4px; word-break:break-word;
  }
  .balance-figure.neg{color:var(--red);}
  .balance-figure.pos{color:var(--green);}
  .balance-label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); display:block; margin-bottom:2px;}
  .mini-stats{display:flex; gap:20px; flex-wrap:wrap;}
  .mini-stat .balance-figure{font-size:17px; border-bottom:2px solid var(--rule-strong); padding-bottom:2px;}

  nav.tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; row-gap:6px;}
  nav.tabs button{
    font-family:'Roboto Slab',serif; font-weight:600; font-size:13.5px;
    background:var(--paper-dim); border:1px solid var(--rule-strong); border-bottom:none;
    color:var(--ink-soft); padding:9px 14px 8px; border-radius:6px 6px 0 0; cursor:pointer;
    white-space:nowrap; position:relative; top:1px;
  }
  nav.tabs button.active{background:var(--paper); color:var(--ink); box-shadow:0 -2px 0 var(--brass) inset;}
  nav.tabs button:not(.active):hover{background:#e6dfc8;}

  section.panel{
    border:1px solid var(--rule-strong); border-radius:0 4px 4px 4px; background:var(--paper);
    padding:20px; min-height:300px; overflow-x:hidden;
  }
  h2.panel-title{font-family:'Roboto Slab',serif; font-size:19px; margin:0 0 4px;}
  p.panel-sub{margin:0 0 18px; color:var(--ink-soft); font-size:13px;}
  h3.section-h{font-family:'Roboto Slab',serif; font-size:15px; margin:0;}

  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    background:var(--ink); color:var(--paper); border:none; padding:9px 16px; border-radius:5px; cursor:pointer;
  }
  .btn:hover{background:#1a231d;}
  .btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--rule-strong);}
  .btn.secondary:hover{background:var(--paper-dim);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--red-soft);}
  .btn.danger:hover{background:var(--red-soft);}
  .btn.small{padding:5px 10px; font-size:12px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .empty{border:1px dashed var(--rule-strong); border-radius:6px; padding:34px 18px; text-align:center; color:var(--ink-soft); font-size:14px;}
  .empty b{color:var(--ink); font-family:'Roboto Slab',serif;}

  .ledger{border-top:1px solid var(--rule-strong);}
  .ledger-row{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:13px 4px; border-bottom:1px solid var(--rule);}
  .ledger-row .name{font-weight:600; font-size:14.5px; overflow-wrap:anywhere;}
  .ledger-row .meta{font-size:12px; color:var(--ink-soft); margin-top:2px; overflow-wrap:anywhere;}
  .amount{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14.5px; text-align:right; white-space:nowrap;}
  .amount.neg{color:var(--red);}
  .amount.pos{color:var(--green);}
  .tag{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:3px; background:var(--brass-soft); color:var(--brass); margin-right:6px;}
  .tag.red{background:var(--red-soft); color:var(--red);}
  .tag.green{background:var(--green-soft); color:var(--green);}

  .progress-track{height:6px; width:110px; background:var(--paper-dim); border-radius:4px; overflow:hidden; border:1px solid var(--rule); flex-shrink:0;}
  .progress-fill{height:100%; background:var(--green);}

  details.acc-detail{margin-top:6px;}
  details.acc-detail summary{cursor:pointer; font-size:12.5px; color:var(--brass); list-style:none; font-weight:600;}
  details.acc-detail summary::-webkit-details-marker{display:none;}
  details.acc-detail summary:before{content:"▸ ";}
  details.acc-detail[open] summary:before{content:"▾ ";}

  .quota-list{margin-top:10px; border:1px solid var(--rule); border-radius:5px; overflow:hidden;}
  .quota-row{display:grid; grid-template-columns:auto 1fr auto auto; gap:8px; align-items:center; padding:8px 10px; font-size:12.5px; border-bottom:1px solid var(--rule); background:var(--paper);}
  .quota-row:last-child{border-bottom:none;}
  .quota-row.paid{background:var(--green-soft);}
  .quota-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--green); flex-shrink:0;}
  .quota-row .qmonth{font-family:'JetBrains Mono',monospace; color:var(--ink-soft); overflow-wrap:anywhere;}
  .quota-row .qamount{font-family:'JetBrains Mono',monospace; text-align:right; white-space:nowrap;}
  .add-quota-row{display:flex; gap:8px; padding:10px; background:var(--paper-dim); flex-wrap:wrap;}
  .add-quota-row input, .add-quota-row select{flex:1; min-width:110px;}

  form .field{margin-bottom:14px;}
  form label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:5px;}
  form input, form select, form textarea{width:100%; padding:9px 10px; border:1px solid var(--rule-strong); border-radius:5px; background:var(--paper); font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);}
  form input:focus, form select:focus, form textarea:focus{outline:2px solid var(--brass); outline-offset:1px;}
  .field-row{display:flex; gap:12px; flex-wrap:wrap;}
  .field-row .field{flex:1; min-width:130px;}
  .radio-group{display:flex; gap:10px; flex-wrap:wrap;}
  .radio-opt{flex:1; min-width:120px; border:1px solid var(--rule-strong); border-radius:5px; padding:9px 10px; cursor:pointer; font-size:13px; text-align:center;}
  .radio-opt.sel{border-color:var(--brass); background:var(--brass-soft); font-weight:600;}
  .radio-opt input{display:none;}

  .overlay{position:fixed; inset:0; background:rgba(38,51,43,0.45); display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper); border:1px solid var(--rule-strong); border-radius:8px; max-width:440px; width:100%; padding:22px; margin-top:2vh;}
  .modal h3{font-family:'Roboto Slab',serif; margin:0 0 16px; font-size:18px;}
  .modal p.hint{font-size:12.5px; color:var(--ink-soft); margin:-8px 0 14px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px; flex-wrap:wrap;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;}

  .upcoming-list, .recent-list{list-style:none; margin:0; padding:0;}
  .upcoming-list li, .recent-list li{display:flex; justify-content:space-between; gap:10px; padding:9px 2px; border-bottom:1px solid var(--rule); font-size:13.5px;}
  .upcoming-list li:last-child, .recent-list li:last-child{border-bottom:none;}
  .col-desc{color:var(--ink-soft); font-size:12px;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

  .explore-block{border:1px solid var(--rule); border-radius:6px; padding:14px; margin-bottom:20px; background:var(--paper-dim);}
  .explore-header{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .month-nav{display:flex; align-items:center; gap:8px;}
  .month-nav-label{font-family:'JetBrains Mono',monospace; font-size:13px; min-width:110px; text-align:center;}
  .explore-stats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  .explore-stats .amount{font-size:15px;}

  @media (max-width:640px){
    .grid-2{grid-template-columns:1fr;}
    header.cover::before{left:0; border:none;}
    .subdate,.balance-row{margin-left:0;}
    .ledger-row{grid-template-columns:1fr auto;}
    .ledger-row .progress-track{display:none;}
    .topbar{justify-content:center;}
    .explore-stats{grid-template-columns:repeat(2,1fr);}
    nav.tabs button{font-size:12.5px; padding:8px 10px 7px;}
  }
  .save-flag{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
    position:fixed; bottom:14px; right:16px; background:var(--paper); border:1px solid var(--rule); padding:4px 10px; border-radius:4px;
    opacity:0; transition:opacity .3s; z-index:40;
  }
  .save-flag.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="menu-wrap">
      <button class="hamburger-btn" onclick="toggleMainMenu(event)">☰</button>
      <div class="dropdown-menu" id="mainMenu">
        <div class="dropdown-version" id="menuVersion">v1.02</div>
        <button onclick="closeMainMenu(); openSettingsForm();">⚙ Configuración</button>
        <button onclick="closeMainMenu(); document.getElementById('fileImport').click();">⇪ Importar Excel</button>
        <button onclick="closeMainMenu(); exportToExcel();">⇩ Exportar a Excel</button>
      </div>
    </div>
    <input type="file" id="fileImport" accept=".xlsx,.xls">
  </div>

  <header class="cover">
    <h1 class="title" id="coverTitle">Libro de Gastos</h1>
    <p class="subdate" id="coverMonth">—</p>
    <div class="balance-row">
      <div>
        <span class="balance-label" id="balanceLabel">Balance acumulado</span>
        <div class="balance-figure" id="balanceFigure">₲ 0</div>
      </div>
      <div class="mini-stats">
        <div class="mini-stat"><span class="balance-label">Ingresos</span><div class="balance-figure pos" id="statIngresos">₲ 0</div></div>
        <div class="mini-stat"><span class="balance-label">Gastos fijos</span><div class="balance-figure neg" id="statCuotas">₲ 0</div></div>
        <div class="mini-stat"><span class="balance-label">Gastos diarios</span><div class="balance-figure neg" id="statGastos">₲ 0</div></div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="resumen">Resumen</button>
    <button class="tab-btn" data-tab="ingresos">Ingresos</button>
    <button class="tab-btn" data-tab="fijos">Gastos Fijos</button>
    <button class="tab-btn" data-tab="gastos">Gastos diarios</button>
    <button class="tab-btn" data-tab="ahorros">Ahorros</button>
  </nav>

  <section class="panel" id="panelResumen"></section>
  <section class="panel" id="panelIngresos" style="display:none;"></section>
  <section class="panel" id="panelFijos" style="display:none;"></section>
  <section class="panel" id="panelGastos" style="display:none;"></section>
  <section class="panel" id="panelAhorros" style="display:none;"></section>

</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="save-flag" id="saveFlag">guardado en este dispositivo</div>

<script>
/* ---------- Estado y almacenamiento local ---------- */
const APP_VERSION = "1.02";
const LS_KEYS = { accounts:"gastos_accounts", incomes:"gastos_incomes", expenses:"gastos_expenses", savings:"gastos_savings" };
let STATE = { accounts: [], incomes: [], expenses: [], savings: [] };
let viewYM = null; // mes explorado en Resumen
let ingresosViewYM = null; let ingresosShowAll = false;
let gastosViewYM = null; let gastosShowAll = false;

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const CATEGORIAS = ["Alimentación","Transporte","Servicios","Salud","Vivienda","Ocio","Educación","Otros"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

const CURRENCY_META = {
  PYG: { symbol:"₲", decimals:0, name:"Guaraní paraguayo" },
  USD: { symbol:"$", decimals:2, name:"Dólar estadounidense" },
  ARS: { symbol:"$", decimals:2, name:"Peso argentino" },
  BRL: { symbol:"R$", decimals:2, name:"Real brasileño" },
  EUR: { symbol:"€", decimals:2, name:"Euro" }
};
let SETTINGS = { currency: "PYG", startMonth: null };
function loadSettings(){
  try{ SETTINGS = Object.assign({currency:"PYG", startMonth:null}, JSON.parse(localStorage.getItem("gastos_settings"))||{}); }catch(e){ SETTINGS = {currency:"PYG", startMonth:null}; }
  if(!SETTINGS.startMonth) SETTINGS.startMonth = currentYM();
}
function saveSettings(){ localStorage.setItem("gastos_settings", JSON.stringify(SETTINGS)); flagSaved(); }
function currencyMeta(){ return CURRENCY_META[SETTINGS.currency] || CURRENCY_META.PYG; }
function currencySymbol(){ return currencyMeta().symbol; }

function fmtGs(n){
  const meta = currencyMeta();
  n = Number(n||0);
  const neg = n < 0;
  n = Math.abs(n);
  const fixed = n.toFixed(meta.decimals);
  const [intPart, decPart] = fixed.split(".");
  const withThousands = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const result = withThousands + (decPart ? ","+decPart : "");
  return (neg?"-":"") + meta.symbol + " " + result;
}
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function currentYM(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function addMonths(ym, n){
  let [y,m] = ym.split("-").map(Number);
  m += n;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return y+"-"+String(m).padStart(2,"0");
}
function ymLabel(ym){
  const [y,m] = (ym||"").split("-").map(Number);
  if(!y||!m) return ym||"";
  return MESES[m-1] + " " + y;
}
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function fechaLabel(dateStr){
  if(!dateStr) return "";
  const [y,m,d] = dateStr.split("-").map(Number);
  if(!y||!m||!d) return dateStr;
  return String(d).padStart(2,"0") + " " + MESES[m-1].slice(0,3) + " " + y;
}
function buildDueDate(startMonth, offsetMonths, day){
  const ym = addMonths(startMonth, offsetMonths);
  const [y,m] = ym.split("-").map(Number);
  const clampedDay = Math.min(day, daysInMonth(y,m));
  return y + "-" + String(m).padStart(2,"0") + "-" + String(clampedDay).padStart(2,"0");
}

function loadAll(){
  try{ STATE.accounts = JSON.parse(localStorage.getItem(LS_KEYS.accounts)) || []; }catch(e){ STATE.accounts = []; }
  try{ STATE.incomes = JSON.parse(localStorage.getItem(LS_KEYS.incomes)) || []; }catch(e){ STATE.incomes = []; }
  try{ STATE.expenses = JSON.parse(localStorage.getItem(LS_KEYS.expenses)) || []; }catch(e){ STATE.expenses = []; }
  try{ STATE.savings = JSON.parse(localStorage.getItem(LS_KEYS.savings)) || []; }catch(e){ STATE.savings = []; }
  // Migración suave: ingresos viejos sin "type" se consideran fijos; fijos usan "collections" (cobros mes a mes)
  STATE.incomes.forEach(i=>{
    if(!i.type) i.type = 'fijo';
    if(i.type==='fijo' && !i.collections) i.collections = [];
    if(i.type==='variable' && i.collected===undefined) i.collected = true;
  });
  viewYM = currentYM();
  ingresosViewYM = currentYM();
  gastosViewYM = currentYM();
}
function migrateIncomeHistory(){
  if(SETTINGS.incomeMigrated) return;
  const cur = currentYM();
  const start = SETTINGS.startMonth || cur;
  let changed = false;
  STATE.incomes.filter(i=>i.type==='fijo').forEach(inc=>{
    let m = start;
    let guard = 0;
    while(m < cur && guard<600){
      if(!inc.collections.find(c=>c.ym===m)){
        inc.collections.push({ id: uid(), ym: m, date: buildDueDate(m,0,inc.day||1), amount: inc.amount, collected: true });
        changed = true;
      }
      m = addMonths(m,1);
      guard++;
    }
  });
  SETTINGS.incomeMigrated = true;
  saveSettings();
  if(changed) saveIncomes();
}
function incomeOccurrence(inc, ym){
  const start = SETTINGS.startMonth || currentYM();
  if(ym < start) return null;
  const existing = (inc.collections||[]).find(c=>c.ym===ym);
  if(existing) return existing;
  return { id:null, ym, date: buildDueDate(ym,0,inc.day||1), amount: inc.amount, collected:false };
}
function toggleIncomeCollected(incId, ym){
  const inc = STATE.incomes.find(i=>i.id===incId);
  if(!inc.collections) inc.collections = [];
  let existing = inc.collections.find(c=>c.ym===ym);
  if(existing){ existing.collected = !existing.collected; }
  else { inc.collections.push({ id: uid(), ym, date: buildDueDate(ym,0,inc.day||1), amount: inc.amount, collected:true }); }
  saveIncomes(); renderAll();
}
function toggleVariableCollected(incId){
  const inc = STATE.incomes.find(i=>i.id===incId);
  inc.collected = !inc.collected;
  saveIncomes(); renderAll();
}
function saveAccounts(){ localStorage.setItem(LS_KEYS.accounts, JSON.stringify(STATE.accounts)); flagSaved(); }
function saveIncomes(){ localStorage.setItem(LS_KEYS.incomes, JSON.stringify(STATE.incomes)); flagSaved(); }
function saveExpenses(){ localStorage.setItem(LS_KEYS.expenses, JSON.stringify(STATE.expenses)); flagSaved(); }
function saveSavings(){ localStorage.setItem(LS_KEYS.savings, JSON.stringify(STATE.savings)); flagSaved(); }
function flagSaved(){
  const f = document.getElementById("saveFlag");
  f.classList.add("show");
  clearTimeout(flagSaved._t);
  flagSaved._t = setTimeout(()=>f.classList.remove("show"), 1000);
}

/* ---------- Tabs ---------- */
const panels = { resumen:"panelResumen", ingresos:"panelIngresos", fijos:"panelFijos", gastos:"panelGastos", ahorros:"panelAhorros" };
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    Object.values(panels).forEach(id=>document.getElementById(id).style.display="none");
    document.getElementById(panels[btn.dataset.tab]).style.display="block";
    renderAll();
  });
});

/* ---------- Modal helper ---------- */

/* ---------- Cálculos de resumen ---------- */
function monthTotals(ym){
  let ingresos = 0;
  STATE.incomes.forEach(i=>{
    if(i.type==='variable'){
      if(i.date && i.date.slice(0,7)===ym && i.collected!==false) ingresos += Number(i.amount||0);
    } else {
      const occ = incomeOccurrence(i, ym);
      if(occ && occ.collected) ingresos += Number(occ.amount||0);
    }
  });
  let cuotas = 0;
  STATE.accounts.forEach(acc=>{ (acc.quotas||[]).forEach(q=>{ if(q.dueDate && q.dueDate.slice(0,7)===ym) cuotas += Number(q.amount||0); }); });
  let gastos = STATE.expenses.filter(e=>e.date && e.date.slice(0,7)===ym).reduce((s,e)=>s+Number(e.amount||0),0);
  let ahorro = 0;
  STATE.savings.forEach(f=>{ (f.movements||[]).forEach(m=>{
    if(m.initial) return; // el saldo inicial no es un movimiento nuevo: no afecta el balance del mes
    if(m.date && m.date.slice(0,7)===ym){ ahorro += (m.type==='deposito' ? Number(m.amount||0) : -Number(m.amount||0)); }
  }); });
  return {ingresos, cuotas, gastos, ahorro, balance: ingresos - cuotas - gastos - ahorro};
}
function cumulativeBalance(ym){
  const start = SETTINGS.startMonth || currentYM();
  if(ym < start) return monthTotals(ym).balance;
  let total = 0;
  let m = start;
  let guard = 0;
  while(true){
    total += monthTotals(m).balance;
    if(m===ym || guard>1200) break;
    m = addMonths(m,1);
    guard++;
  }
  return total;
}
function shiftViewMonth(delta){ viewYM = addMonths(viewYM, delta); renderResumen(); }
function resetViewMonth(){ viewYM = currentYM(); renderResumen(); }

    }
    saveAccounts();
    closeModal();
    renderAll();
  });
}

function generateFixedQuotas(amount, numMonths, startMonth, dueDay){
  const quotas = [];
  for(let i=0;i<numMonths;i++){ quotas.push({ id: uid(), dueDate: buildDueDate(startMonth, i, dueDay), amount, paid:false }); }
  return quotas;
}
function toggleQuota(accId, qId){
  const acc = STATE.accounts.find(a=>a.id===accId);
  const q = acc.quotas.find(q=>q.id===qId);
  q.paid = !q.paid;
  saveAccounts(); renderAll();
}
function deleteQuota(accId, qId){
  const acc = STATE.accounts.find(a=>a.id===accId);
  acc.quotas = acc.quotas.filter(q=>q.id!==qId);
  saveAccounts(); renderAll();
}
function addVariableQuota(accId){
  const acc = STATE.accounts.find(a=>a.id===accId);
  const dueDate = document.getElementById("qdate_"+accId).value;
  const amount = Number(document.getElementById("qamount_"+accId).value);
  if(!dueDate || !amount){ alert("Completá la fecha de vencimiento y el monto de la cuota."); return; }
  acc.quotas.push({ id: uid(), dueDate, amount, paid:false });
  saveAccounts(); renderAll();
}
function deleteAccount(id){
  if(!confirm("¿Eliminar esta cuenta y todas sus cuotas?")) return;
  STATE.accounts = STATE.accounts.filter(a=>a.id!==id);
  saveAccounts(); renderAll();
}

/* ---------- Exportar / Importar Excel ---------- */
function exportToExcel(){
  const wsCuentas = [];
  STATE.accounts.forEach(acc=>{
    if(!acc.quotas || !acc.quotas.length){ wsCuentas.push({ Cuenta:acc.name, Tipo:acc.type==='fija'?'Fija':'Variable', Vencimiento:'', Cuota:'', Pagada:'' }); }
    else { acc.quotas.forEach(q=>{ wsCuentas.push({ Cuenta:acc.name, Tipo:acc.type==='fija'?'Fija':'Variable', Vencimiento:q.dueDate, Cuota:q.amount, Pagada:q.paid?'Sí':'No' }); }); }
  });
  const wsIngresos = STATE.incomes.map(i=>({ Nombre:i.name, Tipo:i.type==='fijo'?'Fijo':'Variable', Monto:i.amount, DiaCobro:i.day||'', FechaCobro:i.date||'', Cobrado: i.type==='variable' ? (i.collected?'Sí':'No') : '', Notas:i.notes||'' }));
  const wsCobros = [];
  STATE.incomes.filter(i=>i.type==='fijo').forEach(inc=>{
    (inc.collections||[]).forEach(c=>{ wsCobros.push({ Nombre:inc.name, Mes:c.ym, Fecha:c.date, Monto:c.amount, Cobrado:c.collected?'Sí':'No' }); });
  });
  const wsGastos = STATE.expenses.map(e=>({ Fecha:e.date, Categoria:e.category, Descripcion:e.description||'', Monto:e.amount }));
  const wsAhorros = [];
  STATE.savings.forEach(f=>{
    if(!f.movements || !f.movements.length){ wsAhorros.push({ Fondo:f.name, Objetivo:f.goal||'', Fecha:'', Tipo:'', Monto:'', SaldoInicial:'' }); }
    else { f.movements.forEach(m=>{ wsAhorros.push({ Fondo:f.name, Objetivo:f.goal||'', Fecha:m.date, Tipo:m.type==='deposito'?'Depósito':'Retiro', Monto:m.amount, SaldoInicial:m.initial?'Sí':'' }); }); }
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(wsCuentas.length?wsCuentas:[{Cuenta:'',Tipo:'',Vencimiento:'',Cuota:'',Pagada:''}]), "Gastos Fijos");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(wsIngresos.length?wsIngresos:[{Nombre:'',Tipo:'',Monto:'',DiaCobro:'',FechaCobro:'',Cobrado:'',Notas:''}]), "Ingresos");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(wsCobros.length?wsCobros:[{Nombre:'',Mes:'',Fecha:'',Monto:'',Cobrado:''}]), "Cobros Mensuales");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(wsGastos.length?wsGastos:[{Fecha:'',Categoria:'',Descripcion:'',Monto:''}]), "Gastos");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(wsAhorros.length?wsAhorros:[{Fondo:'',Objetivo:'',Fecha:'',Tipo:'',Monto:''}]), "Ahorros");
  XLSX.writeFile(wb, `gastos_v${APP_VERSION}_${todayISO()}.xlsx`);
}

document.getElementById("fileImport").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const wb = XLSX.read(evt.target.result, { type:"binary" });
      const readSheet = (name)=> wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name]) : [];

      const rowsCuentas = readSheet("Gastos Fijos").length ? readSheet("Gastos Fijos") : readSheet("Cuentas");
      const rowsIngresos = readSheet("Ingresos");
      const rowsCobros = readSheet("Cobros Mensuales");
      const rowsGastos = readSheet("Gastos");
      const rowsAhorros = readSheet("Ahorros");

      if(!confirm("Importar reemplazará todos los datos actuales guardados en este dispositivo. ¿Continuar?")) return;

      const accMap = new Map();
      rowsCuentas.forEach(r=>{
        const name = (r.Cuenta||"").toString().trim();
        if(!name) return;
        const tipo = (r.Tipo||"").toString().toLowerCase().startsWith("var") ? "variable":"fija";
        if(!accMap.has(name)) accMap.set(name, { id: uid(), name, type: tipo, quotas: [] });
        const venc = (r.Vencimiento || r.Mes || "").toString();
        if(venc){
          accMap.get(name).quotas.push({ id: uid(), dueDate: venc.length===7 ? venc+"-01" : venc, amount: Number(r.Cuota)||0, paid: (r.Pagada||"").toString().toLowerCase().startsWith("s") });
        }
      });
      STATE.accounts = Array.from(accMap.values());

      STATE.incomes = rowsIngresos.filter(r=>r.Nombre).map(r=>{
        const tipo = (r.Tipo||"").toString().toLowerCase().startsWith("var") ? "variable":"fijo";
        return {
          id: uid(), name: r.Nombre.toString(), type: tipo, amount: Number(r.Monto)||0,
          day: tipo==='fijo' ? (Number(r.DiaCobro)||1) : null,
          date: tipo==='variable' ? (r.FechaCobro||"").toString() : null,
          collected: tipo==='variable' ? (r.Cobrado||"").toString().toLowerCase().startsWith("s") : undefined,
          collections: tipo==='fijo' ? [] : undefined,
          notes: (r.Notas||"").toString()
        };
      });
      rowsCobros.forEach(r=>{
        const name = (r.Nombre||"").toString().trim();
        if(!name || !r.Mes) return;
        const inc = STATE.incomes.find(i=>i.type==='fijo' && i.name===name);
        if(inc){
          inc.collections.push({ id: uid(), ym: r.Mes.toString(), date: (r.Fecha||"").toString(), amount: Number(r.Monto)||0, collected: (r.Cobrado||"").toString().toLowerCase().startsWith("s") });
        }
      });

      STATE.expenses = rowsGastos.filter(r=>r.Fecha).map(r=>({
        id: uid(), date: r.Fecha.toString(), category: (r.Categoria||"Otros").toString(),
        description: (r.Descripcion||"").toString(), amount: Number(r.Monto)||0
      }));

      const savMap = new Map();
      rowsAhorros.forEach(r=>{
        const name = (r.Fondo||"").toString().trim();
        if(!name) return;
        if(!savMap.has(name)) savMap.set(name, { id: uid(), name, goal: Number(r.Objetivo)||0, movements: [] });
        if(r.Fecha){
          const isInitial = (r.SaldoInicial||"").toString().toLowerCase().startsWith("s");
          savMap.get(name).movements.push({
            id: uid(), date: r.Fecha.toString(),
            type: (r.Tipo||"").toString().toLowerCase().startsWith("dep") ? "deposito":"retiro",
            amount: Number(r.Monto)||0,
            initial: isInitial,
            note: isInitial ? "Saldo inicial" : undefined
          });
        }
      });
      STATE.savings = Array.from(savMap.values());

      saveAccounts(); saveIncomes(); saveExpenses(); saveSavings();
      renderAll();
      alert("Datos importados correctamente.");
    }catch(err){
      alert("No se pudo leer el archivo. Verificá que sea un Excel exportado desde esta misma app.");
    }
    e.target.value = "";
  };
  reader.readAsBinaryString(file);
});

/* ---------- Utilidades ---------- */
function escapeHtml(str){
  return String(str??"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function renderAll(){
  renderResumen();
  renderIngresos();
  renderFijos();
  renderGastos();
  renderAhorros();
}

        </select>
      </div>
      <p class="hint">Cambia el símbolo y el formato con el que se muestran todos los montos de la app. No convierte automáticamente los números ya cargados.</p>
      <div class="field">
        <label>Mes de inicio del control</label>
        <input type="month" id="set_startMonth" value="${SETTINGS.startMonth}">
      </div>
      <p class="hint">Desde este mes se arrastra el balance acumulado mes a mes: lo que te sobró (o faltó) se suma al mes siguiente, y así sucesivamente.</p>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn">Guardar</button>
      </div>
    </form>
  `);
  document.getElementById("setForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    SETTINGS.currency = document.getElementById("set_currency").value;
    SETTINGS.startMonth = document.getElementById("set_startMonth").value || SETTINGS.startMonth;
    saveSettings();
    closeModal();
    renderAll();
  });
}

/* ---------- Init ---------- */
loadSettings();
loadAll();
migrateIncomeHistory();
renderAll();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
